<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泡沫 FOAM | 專業打卡修訂版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #020617; color: #fff; overflow: hidden; height: 100vh; touch-action: manipulation; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .lyric-container { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; width: 100%; min-height: 120px; padding: 0 10px; }
        .lyric-char { flex: 0 0 auto; cursor: pointer; position: relative; margin: 0 0.1em; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .target-found { color: #fbbf24 !important; font-weight: 900; transform: scale(1.1); text-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
        
        .feedback-note { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 100; text-align: center; width: 80px; }
        .py-text { font-size: 1rem; font-weight: bold; display: block; color: #60a5fa; line-height: 1; }
        .score-text { font-size: 1.4rem; font-weight: 900; display: block; line-height: 1.2; }
        
        @keyframes floatUp { 0% { transform: translate(-50%, 10px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-50%, -60px); opacity: 0; } }
        .animate-float { animation: floatUp 1s ease-out forwards; }
        .rotate-slow { animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        @media (orientation: landscape) and (max-height: 500px) {
            .game-header { padding-top: 0.5rem !important; }
            .score-display { font-size: 2.5rem !important; }
            .lyric-container { min-height: 80px; }
        }
    </style>
</head>
<body>

<div id="app" class="h-screen flex flex-col items-center justify-between py-4 px-2">
    <!-- 頂部資訊 -->
    <div v-if="gameState !== 'login'" class="w-full max-w-5xl flex justify-between items-center z-50 px-4 game-header">
        <div class="flex items-center gap-3">
            <button @click="toggleMusic" class="w-10 h-10 md:w-14 md:h-14 rounded-full glass flex items-center justify-center border-2 border-white/20">
                <span v-if="isPaused" class="text-xl">▶️</span>
                <span v-else class="text-xl rotate-slow">💿</span>
            </button>
            <div class="flex flex-col">
                <p class="text-[10px] text-blue-400 font-bold uppercase">{{ playerName }}</p>
                <p class="text-3xl md:text-6xl font-black text-yellow-400 tabular-nums score-display">{{ score }}</p>
            </div>
        </div>
        <div class="glass p-2 md:p-3 rounded-xl text-right">
            <h4 class="text-[10px] md:text-xs font-bold text-yellow-400">耗時: {{ gameTime }}s</h4>
            <p class="text-[8px] text-white/40">目標韻腳: ao</p>
        </div>
    </div>

    <!-- 登入介面 -->
    <div v-if="gameState === 'login'" class="flex-1 flex flex-col items-center justify-center w-full max-w-sm px-6">
        <div class="glass w-full p-8 rounded-[30px] text-center space-y-6">
            <h1 class="text-5xl font-black italic text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500">泡沫</h1>
            <input v-model="playerName" type="text" placeholder="輸入玩家名稱" class="w-full bg-white/5 border border-white/10 rounded-xl py-4 text-center text-lg outline-none focus:border-yellow-400">
            <button @click="startGame" class="w-full py-4 bg-yellow-400 text-black rounded-xl font-black text-lg">START</button>
        </div>
    </div>

    <!-- 舞台區域 -->
    <div v-if="gameState === 'playing'" class="flex-1 flex flex-col items-center justify-center w-full">
        <div class="lyric-container" :style="{ fontSize: dynamicFontSize }">
            <div :key="currentIndex" class="flex flex-wrap items-center justify-center w-full">
                <div v-for="(char, idx) in currentLineChars" :key="idx"
                    class="lyric-char font-light" :class="{ 'target-found': char.found }"
                    @click="handleTap(idx)">
                    {{ char.text }}
                    <div v-if="char.showFeedback" class="feedback-note animate-float">
                        <span class="py-text">{{ char.pinyin }}</span>
                        <span class="score-text" :class="char.isCorrect ? 'text-yellow-400' : 'text-red-500'">
                            {{ char.isCorrect ? '+10' : '-3' }}
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-md space-y-4 px-4">
            <div class="flex gap-3">
                <button @click="changeLine(-1)" class="flex-1 py-3 rounded-xl glass text-[10px] font-bold" :disabled="currentIndex === 0">PREV</button>
                <button @click="changeLine(1)" class="flex-[2] py-3 rounded-xl bg-white text-black font-black text-xs">
                    {{ currentIndex === lyrics.length - 1 ? '完成挑戰並打卡' : '下一句 NEXT' }}
                </button>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-1.5 bg-white/5 rounded-full overflow-hidden">
                    <div class="h-full bg-yellow-400 transition-all duration-500" :style="{ width: ((currentIndex + 1)/lyrics.length)*100 + '%' }"></div>
                </div>
                <span class="text-[10px] text-white/40">{{ currentIndex + 1 }} / {{ lyrics.length }}</span>
            </div>
        </div>
    </div>

    <!-- 結算介面 (打卡) -->
    <div v-if="gameState === 'end'" class="flex-1 flex flex-col items-center justify-center w-full max-w-sm px-6 space-y-6">
        <div class="glass w-full p-8 rounded-[40px] text-center">
            <p class="text-gray-400 text-sm mb-2 uppercase tracking-widest">Final Result</p>
            <h2 class="text-7xl font-black text-yellow-400 mb-4">{{ score }}</h2>
            <div class="grid grid-cols-2 gap-4 text-sm border-t border-white/10 pt-4">
                <div><p class="text-white/40">玩家</p><p class="font-bold">{{ playerName }}</p></div>
                <div><p class="text-white/40">時間</p><p class="font-bold">{{ gameTime }}s</p></div>
            </div>
        </div>
        <button @click="shareToWhatsApp" class="w-full bg-[#25D366] text-white py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2 shadow-lg">
            WhatsApp 分享戰績
        </button>
        <button @click="restart" class="w-full glass text-white/60 py-4 rounded-2xl font-black text-lg">重新開始</button>
    </div>
</div>

<script>
const { createApp, ref, computed, nextTick, onUnmounted } = Vue;

createApp({
    setup() {
        const gameState = ref('login');
        const playerName = ref('');
        const score = ref(0);
        const currentIndex = ref(0);
        const currentLineChars = ref([]);
        const isPaused = ref(false);
        const tappedHistory = ref({}); 
        const gameTime = ref(0);
        let timerInterval = null;

        const audio = new Audio('foam.mp3');
        audio.preload = "auto";

        const CORRECT_TARGETS = ['泡', '早', '道', '要', '掉', '渺', '到', '告', '校', '笑', '少', '好', '考', '描', '跑', '聊'];

        const lyrics = [
            { text: "陽光下的泡沫是彩色的", py: ["yáng","guāng","xià","de","pào","mò","shì","cǎi","sè","de"] },
            { text: "就像被騙的我是幸福的", py: ["jiù","xiàng","bèi","piàn","de","wǒ","shì","xìng","fú","de"] },
            { text: "追究什麼對錯你的謊言", py: ["zhuī","jiū","shén","me","duì","cuò","nǐ","de","huǎng","yán"] },
            { text: "基於你還愛我", py: ["jī","yú","nǐ","hái","ài","wǒ"] },
            { text: "美麗的泡沫雖然一剎花火", py: ["měi","lì","de","pào","mò","suī","rán","yī","chà","huā","huǒ"] },
            { text: "你所有承諾雖然都太脆弱", py: ["nǐ","suǒ","yǒu","chéng","nuò","suī","rán","dōu","tài","cuì","ruò"] },
            { text: "但愛像泡沫如果能夠看破", py: ["dàn","ài","xiàng","pào","mò","rú","guǒ","néng","gòu","kàn","pò"] },
            { text: "有什麼難過", py: ["yǒu","shén","me","nán","guò"] },
            { text: "早該知道泡沫一觸就破", py: ["zǎo","gāi","zhī","dào","pào","mò","yī","chù","jiù","pò"] },
            { text: "就像已傷的心不勝折磨", py: ["jiù","xiàng","yǐ","shāng","de","xīn","bù","shèng","zhé","mó"] },
            { text: "也不是誰的錯謊言再多", py: ["yě","bù","shì","shuí","de","cuò","huǎng","yán","zài","duō"] },
            { text: "基於你還愛我", py: ["jī","yú","nǐ","hái","ài","wǒ"] },
            { text: "美麗的泡沫雖然一剎花火", py: ["měi","lì","de","pào","mò","suī","rán","yī","chà","huā","huǒ"] },
            { text: "你所有承諾雖然都太脆弱", py: ["nǐ","suǒ","yǒu","chéng","nuò","suī","rán","dōu","tài","cuì","ruò"] },
            { text: "愛本是泡沫如果能夠看破", py: ["ài","běn","shì","pào","mò","rú","guǒ","néng","gòu","kàn","pò"] },
            { text: "有什麼難過", py: ["yǒu","shén","me","nán","guò"] },
            { text: "再美的花朵盛開過就凋落", py: ["zài","měi","de","huā","duǒ","shèng","kāi","guò","jiù","diāo","luò"] },
            { text: "再亮眼的星一閃過就墜落", py: ["zài","liàng","yǎn","de","xīng","yī","shǎn","guò","jiù","zhuì","luò"] },
            { text: "愛本是泡沫如果能夠看破", py: ["ài","běn","shì","pào","mò","rú","guǒ","néng","gòu","kàn","pò"] },
            { text: "有什麼難過", py: ["yǒu","shén","me","nán","guò"] },
            { text: "為什麼難過有什麼難過為什麼難過", py: ["wèi","shén","me","nán","guò","yǒu","shén","me","nán","guò","wèi","shén","me","nán","guò"] },
            { text: "全都是泡沫只一剎的花火", py: ["quán","dōu","shì","pào","mò","zhǐ","yī","chà","de","huā","huǒ"] },
            { text: "你所有承諾全部都太脆弱", py: ["nǐ","suǒ","yǒu","chéng","nuò","quán","bù","dōu","tài","cuì","ruò"] },
            { text: "而你的輪廓怪我沒有看破", py: ["ér","nǐ","de","lún","kuò","guài","wǒ","méi","yǒu","kàn","pò"] },
            { text: "才如此難過", py: ["cái","rú","cǐ","nán","guò"] },
            { text: "相愛的把握要如何再搜索", py: ["xiāng","ài","de","bǎ","wò","yào","rú","hé","zài","sōu","suǒ"] },
            { text: "相擁著寂寞難道就不寂寞", py: ["xiāng","yōng","zhe","jì","mò","nán","dào","jiù","bù","jì","mò"] },
            { text: "愛本是泡沫怪我沒有看破", py: ["ài","běn","shì","pào","mò","guài","wǒ","méi","yǒu","kàn","pò"] },
            { text: "才如此難過", py: ["cái","rú","cǐ","nán","guò"] },
            { text: "在雨下的泡沫一觸就破", py: ["zài","yǔ","xià","de","pào","mò","yī","chù","jiù","pò"] },
            { text: "當初熾熱的心早已沉沒", py: ["dāng","chū","chì","rè","de","xīn","zǎo","yǐ","chén","mó"] },
            { text: "說什麼你愛我如果騙我", py: ["shuō","shén","me","nǐ","ài","wǒ","rú","guǒ","piàn","wǒ"] },
            { text: "我寧願你沉默", py: ["wǒ","níng","yuàn","nǐ","chén","mò"] }
        ];

        const dynamicFontSize = computed(() => {
            const count = currentLineChars.value.length;
            if (window.innerHeight < 500) return count > 12 ? '1.4rem' : '1.9rem';
            return count > 12 ? '1.8rem' : (count > 8 ? '2.5rem' : '3.2rem');
        });

        const updateLine = () => {
            const row = lyrics[currentIndex.value];
            currentLineChars.value = row.text.split('').map((char, i) => {
                const historyKey = `${currentIndex.value}-${i}`;
                const isTappedBefore = tappedHistory.value[historyKey] || false;
                return {
                    text: char,
                    pinyin: row.py[i] || "",
                    isTarget: CORRECT_TARGETS.includes(char),
                    found: isTappedBefore && CORRECT_TARGETS.includes(char),
                    isTapped: isTappedBefore,
                    showFeedback: false,
                    isCorrect: false
                };
            });
        };

        const handleTap = (idx) => {
            const charObj = currentLineChars.value[idx];
            const historyKey = `${currentIndex.value}-${idx}`;
            if (charObj.isTapped || tappedHistory.value[historyKey]) return;

            charObj.isTapped = true;
            tappedHistory.value[historyKey] = true;
            charObj.showFeedback = false;
            
            nextTick(() => {
                charObj.showFeedback = true;
                if (charObj.isTarget) {
                    charObj.found = true;
                    charObj.isCorrect = true;
                    score.value += 10;
                } else {
                    charObj.isCorrect = false;
                    score.value = Math.max(0, score.value - 3);
                }
            });
            setTimeout(() => { charObj.showFeedback = false; }, 1000);
        };

        const startGame = () => {
            if (playerName.value) {
                gameState.value = 'playing';
                updateLine();
                // 啟動計時
                timerInterval = setInterval(() => { gameTime.value++; }, 1000);
                // 核心修復：點擊按鈕後立即播放音樂
                audio.play().catch(e => console.log("Audio play blocked"));
            }
        };

        const toggleMusic = () => {
            if (audio.paused) { audio.play(); isPaused.value = false; }
            else { audio.pause(); isPaused.value = true; }
        };

        const changeLine = (step) => {
            const next = currentIndex.value + step;
            if (next >= 0 && next < lyrics.length) {
                currentIndex.value = next;
                updateLine();
            } else if (next >= lyrics.length) {
                endGame();
            }
        };

        const endGame = () => {
            gameState.value = 'end';
            clearInterval(timerInterval);
            audio.pause();
        };

        const shareToWhatsApp = () => {
            const text = `🎤 《泡沫》互動歌詞挑戰 🎵\n\n👤 玩家：${playerName.value}\n🏆 最終得分：${score.value}\n⏱ 完成時間：${gameTime.value} 秒\n\n「全都是泡沫，只一剎的花火...」\n你也想試試看嗎？`;
            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        };

        const restart = () => location.reload();

        onUnmounted(() => clearInterval(timerInterval));

        return { gameState, playerName, score, currentIndex, currentLineChars, isPaused, lyrics, dynamicFontSize, gameTime, startGame, toggleMusic, handleTap, changeLine, restart, shareToWhatsApp };
    }
}).mount('#app');
</script>
</body>
</html>
